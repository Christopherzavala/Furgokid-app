name: EAS Build (manual)

# Builds consume EAS credits, so they never run automatically:
# - no push or pull_request triggers
# - the production profile is intentionally unavailable
# - every run records the actor, profile, platform and ref in the UI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (production is intentionally excluded)'
        required: true
        type: choice
        default: preview
        options:
          - development
          - staging
          - preview
      platform:
        description: 'Target platform'
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build
    # EAS credentials are available only through the protected Environment.
    # That Environment must restrict deployments to the protected main branch.
    if: github.ref == 'refs/heads/main'
    environment:
      name: eas-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Choice inputs are validated by GitHub, and re-validated here so a
      # malformed API call cannot bypass the allowlist.
      - name: Validate inputs
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          case "${BUILD_PROFILE}" in
            development|staging|preview) ;;
            *)
              echo "profile '${BUILD_PROFILE}' is not allowed (development, staging, preview)."
              exit 1
              ;;
          esac

          if [ "${BUILD_PROFILE}" = "production" ]; then
            echo "production builds are intentionally disabled in this workflow."
            exit 1
          fi

          case "${BUILD_PLATFORM}" in
            android|ios|all) ;;
            *)
              echo "platform '${BUILD_PLATFORM}' is not allowed (android, ios, all)."
              exit 1
              ;;
          esac

          echo "Inputs validated: profile=${BUILD_PROFILE} platform=${BUILD_PLATFORM} ref=${GITHUB_REF}"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          # Exact CLI version, reviewed against the npm package metadata on 2026-11-04.
          eas-version: 27.2.0

      # Expo authentication is scoped to the single step that consumes it.
      - name: Run EAS build
        env:
          EAS_BUILD_PROFILE: ${{ inputs.profile }}
          EAS_BUILD_PLATFORM: ${{ inputs.platform }}
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail
          eas build \
            --platform "${EAS_BUILD_PLATFORM}" \
            --profile "${EAS_BUILD_PROFILE}" \
            --non-interactive \
            --no-wait
