<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FurgoKid - Seguimiento en Vivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #F5F7FA; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; padding: 24px; text-align: center; }
    .badge { display: inline-block; background: #E8F5E9; color: #2E7D32; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: bold; color: '#1565C0'; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }
    .status-box { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: left; }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .status-row:last-child { margin-bottom: 0; }
    .label { color: #64748B; font-weight: 500; }
    .value { font-weight: bold; color: #1E293B; }
    .wa-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; text-decoration: none; font-size: 15px; font-weight: bold; width: 100%; padding: 14px; border-radius: 10px; box-shadow: 0 4px 10px rgba(37,211,102,0.3); transition: background 0.2s; border: none; cursor: pointer; }
    .wa-button:hover { background: #1EBE5D; }
    .footer { margin-top: 20px; font-size: 12px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="liveBadge">EN VIVO</div>
    <h1 class="title">FurgoKid Live Tracking</h1>
    <p class="subtitle" id="schoolSubtitle">Transporte Escolar</p>

    <div class="status-box">
      <div class="status-row">
        <span class="label">Estado del Viaje:</span>
        <span class="value" id="tripStatus">En recorrido</span>
      </div>
      <div class="status-row">
        <span class="label">Última Actualización:</span>
        <span class="value" id="lastUpdated">Hace un momento</span>
      </div>
      <div class="status-row">
        <span class="label">Estado Pasajeros:</span>
        <span class="value" id="passengerSummary">1 En tránsito</span>
      </div>
    </div>

    <button class="wa-button" id="whatsappBtn" onclick="shareWhatsApp()">
      💬 Compartir por WhatsApp
    </button>

    <p class="footer">Protegido por FurgoKid · Minimización de Datos de Menores</p>
  </div>

  <script src="tracking.js"></script>
</body>
</html>
